

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Yoga Classes</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        background-color: #f2f2f2;
        color: #333;
      }
      
      header {
        background: #7cc3cb;
        color: #fff;
        text-align: center;
        padding: 1em 0;
      }
      
      main {
        padding: 20px;
        max-width: 800px;
        margin: 0 auto;
      }
      
      .contact-info h2, .contact-form h2 {
        color: #7cc3cb;
      }
      
      ul {
        list-style-type: none;
        padding: 0;
      }
      
      ul li {
        margin: 5px 0;
      }
      
      a {
        color: #7cc3cb;
        text-decoration: none;
      }
      
      a:hover {
        text-decoration: underline;
      }
      
      form {
        background: #fff;
        padding: 20px;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
      
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      
      input[type="text"], input[type="email"], textarea {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      
      button {
        background: #80d3dc;
        color: #fff;
        border: none;
        padding: 10px 20px;
        cursor: pointer;
        border-radius: 5px;
      }
      
      button:hover {
        background: #7cc3cb;
      }
      
      footer {
        text-align: center;
        padding: 1em 0;
        background: #7cc3cb;
        color: #fff;
      }
      
  </style>
</head>
<body>
  <header>
    <h1>Contact Us</h1>
  </header>
  
  <main>
    <section class="contact-info">
      <h2>Get in Touch</h2>
      <p>We’d love to hear from you! Feel free to reach out via the form below, email, or phone.</p>
      <ul>
        <li><strong>Email:</strong> <a href="mailto:yoga@gmail.com">yogastudio1122@gmail.com</a></li>
        <li><strong>Phone:</strong> +123-456-7890</li>
        <li><strong>Address:</strong> 031 Yoga Street,Ghaziabad</li>
      </ul>
    </section>

    <section class="contact-form">
      <h2>Contact Form</h2>
      <form action="#" method="post">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Yoga Classes. All Rights Reserved.</p>
  </footer>
</body>
</html>
